  Biome 2.2.0 for lint/format. Design system "Midnight Harbor" (dark/glassmorphism).
  Project structure convention: types/ and components/ folders per package/app.
  No test framework installed. Spanish UI locale (AR), English technical artifacts.

strict_tdd: false

testing:
  runner: none
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  linter: "@biomejs/biome 2.2.0"
