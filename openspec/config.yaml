phases:
  propose:
    required: true
    output: openspec/changes/{change-id}/proposal.md
  spec:
    required: true
    output: openspec/changes/{change-id}/spec.md
  design:
    required: true
    output: openspec/changes/{change-id}/design.md
  tasks:
    required: true
    output: openspec/changes/{change-id}/tasks.md
  apply:
    required: true
  verify:
    required: true
    after: apply
  archive:
    required: true
    after: verify
    output: openspec/changes/archive/{change-id}.md

chain_strategy: force-chained
